<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | LiFi Control</title>
  <style>
    {% include "dashboard/theme_tokens.html" %}
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; background: var(--color-background); color: var(--color-text-primary); font-family: var(--font-primary), var(--font-fallback); }
    header { display: flex; align-items: center; justify-content: space-between; gap: var(--spacing-xl); min-height: var(--component-header-height); padding: var(--spacing-md) clamp(var(--spacing-xl), 5vw, 64px); border-bottom: 1px solid var(--component-header-border); background: var(--component-header-background); }
    .brand { color: var(--color-primary); font-size: var(--font-size-sm); font-weight: var(--font-weight-bold); letter-spacing: .12em; text-transform: uppercase; }
    .user { display: flex; align-items: center; gap: var(--spacing-lg); color: var(--component-header-text); font-size: var(--font-size-sm); }
    a { color: var(--color-primary); text-decoration: none; }
    a:hover { color: var(--color-primary_hover); }
    main { width: min(1100px, 100%); margin: 0 auto; padding: var(--spacing-3xl) var(--spacing-xl); }
    h1 { margin: 0 0 var(--spacing-sm); font-family: var(--font-heading), var(--font-fallback); font-size: var(--font-size-4xl); font-weight: var(--font-weight-bold); line-height: var(--line-height-tight); }
    .subtitle { margin: 0 0 var(--spacing-2xl); color: var(--color-text-secondary); }
    .panel { overflow: hidden; border: var(--component-card-border); border-radius: var(--component-card-radius); background: var(--component-card-background); box-shadow: var(--component-card-shadow); }
    .panel-heading { display: flex; align-items: center; justify-content: space-between; gap: var(--spacing-lg); padding: var(--spacing-lg) var(--spacing-xl); border-bottom: 1px solid var(--color-border); }
    .panel-heading h2 { margin: 0; font-size: var(--font-size-base); }
    .live { display: flex; align-items: center; gap: var(--spacing-sm); color: var(--color-text-secondary); font-size: var(--font-size-xs); }
    .live::before { width: 8px; height: 8px; border-radius: var(--radius-full); background: var(--color-success); content: ""; }
    .stream { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; background: #05080e; }
    .controls { display: flex; align-items: center; justify-content: space-between; gap: var(--spacing-xl); margin-top: var(--spacing-xl); padding: var(--spacing-xl); border: var(--component-card-border); border-radius: var(--component-card-radius); background: var(--component-card-background); box-shadow: var(--component-card-shadow); }
    .control-copy strong { display: block; margin-bottom: var(--spacing-xs); }
    .control-copy span { color: var(--color-text-secondary); font-size: var(--font-size-sm); }
    .connect { min-width: 150px; min-height: max(var(--component-button-height), {{ theme.accessibility.minimum_touch_target }}); padding: var(--spacing-sm) var(--spacing-lg); border: 0; border-radius: var(--component-button-radius); background: var(--component-button-primary_background); color: var(--component-button-primary_text); font: inherit; font-size: var(--font-size-sm); font-weight: var(--component-button-font_weight); cursor: pointer; transition: background var(--effect-transition), box-shadow var(--effect-transition); }
    .connect:hover { background: var(--component-button-hover_background); }
    .connect.disconnect { background: var(--color-error); color: #FFFFFF; }
    .connect.disconnect:hover { opacity: var(--effect-hover_opacity); }
    .connect:focus-visible { outline: none; box-shadow: var(--effect-focus_ring); }
    .connect:disabled { opacity: .55; cursor: not-allowed; }
    .logout { min-height: max(var(--component-button-height), {{ theme.accessibility.minimum_touch_target }}); padding: 0 var(--spacing-sm); border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--color-primary); font: inherit; cursor: pointer; }
    .logout:hover { background: var(--color-surface_hover); }
    .logout:focus-visible { outline: none; box-shadow: var(--effect-focus_ring); }
    #connection-status { min-height: 20px; margin: var(--spacing-md) var(--spacing-xs) 0; color: var(--color-text-muted); font-size: var(--font-size-xs); }
    @media (max-width: 560px) { .controls { align-items: stretch; flex-direction: column; } .connect { width: 100%; } header { align-items: flex-start; } .user { gap: var(--spacing-sm); } h1 { font-size: var(--font-size-3xl); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; } }
  </style>
</head>
<body>
  <header>
    <div class="brand">LiFi Control</div>
    <div class="user">
      <span>{{ request.user.username }}</span>
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button class="logout" type="submit">Log out</button>
      </form>
    </div>
  </header>
  <main>
    <h1>Dashboard</h1>
    <p class="subtitle">Monitor your camera and control the LiFi connection.</p>
    <section class="panel" aria-labelledby="camera-title">
      <div class="panel-heading">
        <h2 id="camera-title">Camera stream</h2>
        <span class="live">Stream player</span>
      </div>
      <iframe class="stream" src="{{ camera_stream_url }}" title="Live camera stream" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </section>
    <section class="controls" aria-label="Connection controls">
      <div class="control-copy">
        <strong>LiFi connection</strong>
        <span id="connection-label">Disconnected</span>
      </div>
      <button id="connect-button" class="connect" type="button" disabled>Connecting…</button>
    </section>
    <p id="connection-status" role="status" aria-live="polite">Connecting to control service…</p>
  </main>
  <script>
    (() => {
      const button = document.getElementById("connect-button");
      const label = document.getElementById("connection-label");
      const status = document.getElementById("connection-status");
      const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      const socket = new WebSocket(`${wsProtocol}//${window.location.host}/ws/control/`);
      let connected = false;
      let pending = false;

      function updateButton() {
        button.textContent = connected ? "Disconnect" : "Connect";
        button.classList.toggle("disconnect", connected);
        label.textContent = connected ? "Connected" : "Disconnected";
        button.disabled = pending || socket.readyState !== WebSocket.OPEN;
      }

      socket.addEventListener("open", () => {
        status.textContent = "Control service connected.";
        updateButton();
      });
      socket.addEventListener("message", (event) => {
        let message;
        try {
          message = JSON.parse(event.data);
        } catch {
          status.textContent = "Received an invalid response from the control service.";
          pending = false;
          updateButton();
          return;
        }
        if (message.error) {
          status.textContent = message.error;
          pending = false;
          updateButton();
          return;
        }
        if (message.command === "connection" && message.status === "accepted") {
          connected = message.value === "connect";
          pending = false;
          status.textContent = `Connection ${message.value === "connect" ? "established" : "closed"}.`;
          updateButton();
        }
      });
      socket.addEventListener("close", () => {
        pending = false;
        button.disabled = true;
        button.textContent = "Unavailable";
        status.textContent = "Control service disconnected. Refresh the page to reconnect.";
      });
      socket.addEventListener("error", () => {
        status.textContent = "Could not connect to the control service.";
      });
      button.addEventListener("click", () => {
        if (pending || socket.readyState !== WebSocket.OPEN) return;
        pending = true;
        updateButton();
        socket.send(JSON.stringify({
          command: "connection",
          value: connected ? "disconnect" : "connect"
        }));
      });
    })();
  </script>
</body>
</html>
