<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | LiFi Control</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #0b1220; color: #e5edf8; }
    .card { width: min(100%, 400px); padding: 36px; border: 1px solid #26334a; border-radius: 18px; background: #111b2c; box-shadow: 0 24px 80px #0005; }
    .eyebrow { color: #55d6be; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 12px 0 8px; font-size: 28px; }
    p { margin: 0 0 28px; color: #9aabc2; }
    label { display: block; margin: 18px 0 8px; font-size: 14px; font-weight: 600; }
    input { width: 100%; padding: 12px 14px; border: 1px solid #33435e; border-radius: 9px; background: #0b1220; color: inherit; font: inherit; }
    input:focus { outline: 2px solid #55d6be; outline-offset: 1px; }
    button { width: 100%; margin-top: 24px; padding: 12px; border: 0; border-radius: 9px; background: #55d6be; color: #06251f; font: inherit; font-weight: 750; cursor: pointer; }
    .error { margin: 16px 0 0; color: #ff9e9e; font-size: 14px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">LiFi Control</div>
    <h1>Welcome back</h1>
    <p>Sign in to open the camera dashboard.</p>
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <label for="id_username">Username</label>
      <input id="id_username" name="username" type="text" autocomplete="username" required autofocus>
      <label for="id_password">Password</label>
      <input id="id_password" name="password" type="password" autocomplete="current-password" required>
      {% if form.errors %}<div class="error" role="alert">Username or password was not recognized.</div>{% endif %}
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
