<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | LiFi Control</title>
  <style>
    {% include "dashboard/theme_tokens.html" %}
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: var(--spacing-xl); background: var(--color-background); color: var(--color-text-primary); font-family: var(--font-primary), var(--font-fallback); }
    .card { width: min(100%, 400px); padding: var(--component-card-padding); border: var(--component-card-border); border-radius: var(--component-card-radius); background: var(--component-card-background); box-shadow: var(--component-card-shadow); }
    .eyebrow { color: var(--color-primary); font-size: var(--font-size-xs); font-weight: var(--font-weight-bold); letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: var(--spacing-md) 0 var(--spacing-sm); font-family: var(--font-heading), var(--font-fallback); font-size: var(--font-size-3xl); line-height: var(--line-height-tight); }
    p { margin: 0 0 var(--spacing-2xl); color: var(--color-text-secondary); }
    label { display: block; margin: var(--spacing-lg) 0 var(--spacing-sm); font-size: var(--font-size-sm); font-weight: var(--font-weight-semibold); }
    input { width: 100%; min-height: max(var(--component-input-height), {{ theme.accessibility.minimum_touch_target }}); padding: var(--spacing-sm) var(--spacing-md); border: 1px solid var(--component-input-border); border-radius: var(--component-input-radius); background: var(--component-input-background); color: var(--component-input-text); font: inherit; transition: border-color var(--effect-transition), box-shadow var(--effect-transition); }
    input::placeholder { color: var(--component-input-placeholder); }
    input:focus-visible { border-color: var(--component-input-focus_border); outline: none; box-shadow: var(--effect-focus_ring); }
    button { width: 100%; min-height: max(var(--component-button-height), {{ theme.accessibility.minimum_touch_target }}); margin-top: var(--spacing-xl); padding: var(--spacing-sm); border: 0; border-radius: var(--component-button-radius); background: var(--component-button-primary_background); color: var(--component-button-primary_text); font: inherit; font-weight: var(--component-button-font_weight); cursor: pointer; transition: background var(--effect-transition), box-shadow var(--effect-transition); }
    button:hover { background: var(--component-button-hover_background); }
    button:focus-visible { outline: none; box-shadow: var(--effect-focus_ring); }
    .error { margin: var(--spacing-lg) 0 0; color: var(--color-error); font-size: var(--font-size-sm); }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">LiFi Control</div>
    <h1>Welcome back</h1>
    <p>Sign in to open the camera dashboard.</p>
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <label for="id_username">Username</label>
      <input id="id_username" name="username" type="text" autocomplete="username" required autofocus>
      <label for="id_password">Password</label>
      <input id="id_password" name="password" type="password" autocomplete="current-password" required>
      {% if form.errors %}<div class="error" role="alert">Username or password was not recognized.</div>{% endif %}
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
